<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="100%" style="border-radius: 16px;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&amp;family=Fira+Code:wght@400;500;700&amp;display=swap');

      /* ── Typography ── */
      .title-name {
        font-family: 'Outfit', sans-serif;
        font-weight: 800;
        font-size: 54px;
        fill: url(#name-grad);
        filter: drop-shadow(0px 3px 16px rgba(56, 189, 248, 0.3));
      }

      .role-title {
        font-family: 'Fira Code', monospace;
        font-weight: 600;
        font-size: 18px;
        fill: #38BDF8;
      }

      .context-upper {
        font-family: 'Outfit', sans-serif;
        font-size: 11px;
        fill: #708BA7;
        font-weight: 600;
        letter-spacing: 3.5px;
        text-transform: uppercase;
      }

      .context-lower {
        font-family: 'Outfit', sans-serif;
        font-size: 12px;
        fill: #4B6078;
        font-weight: 400;
        letter-spacing: 1.5px;
      }

      .status-text {
        font-family: 'Fira Code', monospace;
        font-size: 10px;
        fill: #94A3B8;
        letter-spacing: 1px;
      }

      .code-symbol {
        font-family: 'Fira Code', monospace;
        font-weight: 700;
        fill: #1E293B;
      }

      /* ── Cursor Blink ── */
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        animation: cursorBlink 0.9s step-end infinite;
        fill: #38BDF8;
        font-weight: 700;
      }

      /* ── Floating ── */
      @keyframes float {
        0%   { transform: translateY(0px); }
        50%  { transform: translateY(-6px); }
        100% { transform: translateY(0px); }
      }
      .floating { animation: float 5s ease-in-out infinite; }

      /* ── Glowing Border ── */
      @keyframes borderTrace {
        0%   { stroke-dashoffset: 2260; }
        100% { stroke-dashoffset: 0; }
      }
      .traced-border {
        stroke-dasharray: 400 1860;
        animation: borderTrace 12s linear infinite;
      }

      /* ── Neural Pulse ── */
      @keyframes pulse {
        0%   { r: 4; opacity: 0.35; }
        50%  { r: 11; opacity: 0.9; }
        100% { r: 4; opacity: 0.35; }
      }
      .pulse-node { animation: pulse 3.5s ease-in-out infinite; }

      /* ── Particle Drift ── */
      @keyframes drift1 {
        0%   { transform: translate(0, 0); opacity: 0.25; }
        50%  { transform: translate(15px, -20px); opacity: 0.65; }
        100% { transform: translate(0, 0); opacity: 0.25; }
      }
      @keyframes drift2 {
        0%   { transform: translate(0, 0); opacity: 0.2; }
        50%  { transform: translate(-12px, 16px); opacity: 0.55; }
        100% { transform: translate(0, 0); opacity: 0.2; }
      }
      @keyframes drift3 {
        0%   { transform: translate(0, 0); opacity: 0.3; }
        50%  { transform: translate(10px, 12px); opacity: 0.15; }
        100% { transform: translate(0, 0); opacity: 0.3; }
      }
      .particle-1 { animation: drift1 7s ease-in-out infinite; }
      .particle-2 { animation: drift2 9s ease-in-out infinite; }
      .particle-3 { animation: drift3 6s ease-in-out infinite; }

      /* ── Status Dot ── */
      @keyframes statusPulse {
        0%, 100% { r: 3; opacity: 0.8; }
        50%      { r: 5; opacity: 1; }
      }
      .status-dot { animation: statusPulse 2s ease-in-out infinite; }

      /* ── Code Symbol Float ── */
      @keyframes symbolFloat {
        0%   { transform: translateY(0) rotate(0deg); opacity: 0.05; }
        50%  { transform: translateY(-5px) rotate(4deg); opacity: 0.1; }
        100% { transform: translateY(0) rotate(0deg); opacity: 0.05; }
      }
      .symbol-float { animation: symbolFloat 8s ease-in-out infinite; }

      /* ── Accent Line Glow ── */
      @keyframes lineGlow {
        0%, 100% { opacity: 0.2; }
        50%      { opacity: 0.55; }
      }
      .accent-line { animation: lineGlow 3.5s ease-in-out infinite; }

      /* ── Dot Separator Pulse ── */
      @keyframes dotPulse {
        0%, 100% { opacity: 0.3; }
        50%      { opacity: 0.7; }
      }
      .dot-sep { animation: dotPulse 2.5s ease-in-out infinite; }
    </style>

    <!-- ── Gradients ── -->
    <linearGradient id="bg-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01060F" />
      <stop offset="35%" stop-color="#0A0F1F" />
      <stop offset="65%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#01060F" />
    </linearGradient>

    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="40%" stop-color="#7DD3FC" />
      <stop offset="75%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E75B6" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0E75B6" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#818CF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="glow-name" cx="28%" cy="42%" r="30%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-right" cx="78%" cy="48%" r="30%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.25" />
    </radialGradient>

    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ═══════════ Background Stack ═══════════ -->
  <rect width="850" height="280" fill="url(#bg-deep)" rx="16" />
  <rect width="850" height="280" fill="url(#glow-name)" rx="16" />
  <rect width="850" height="280" fill="url(#glow-right)" rx="16" />
  <rect width="850" height="280" fill="url(#vignette)" rx="16" />

  <!-- Fine Grid -->
  <g opacity="0.018">
    <line x1="0" y1="40" x2="850" y2="40" stroke="#fff" stroke-width="0.5" />
    <line x1="0" y1="80" x2="850" y2="80" stroke="#fff" stroke-width="0.5" />
    <line x1="0" y1="120" x2="850" y2="120" stroke="#fff" stroke-width="0.5" />
    <line x1="0" y1="160" x2="850" y2="160" stroke="#fff" stroke-width="0.5" />
    <line x1="0" y1="200" x2="850" y2="200" stroke="#fff" stroke-width="0.5" />
    <line x1="0" y1="240" x2="850" y2="240" stroke="#fff" stroke-width="0.5" />
    <line x1="106" y1="0" x2="106" y2="280" stroke="#fff" stroke-width="0.5" />
    <line x1="212" y1="0" x2="212" y2="280" stroke="#fff" stroke-width="0.5" />
    <line x1="318" y1="0" x2="318" y2="280" stroke="#fff" stroke-width="0.5" />
    <line x1="424" y1="0" x2="424" y2="280" stroke="#fff" stroke-width="0.5" />
    <line x1="530" y1="0" x2="530" y2="280" stroke="#fff" stroke-width="0.5" />
    <line x1="636" y1="0" x2="636" y2="280" stroke="#fff" stroke-width="0.5" />
    <line x1="742" y1="0" x2="742" y2="280" stroke="#fff" stroke-width="0.5" />
  </g>

  <!-- ═══════════ Particle Field ═══════════ -->
  <g>
    <circle cx="115" cy="42"  r="1.4" fill="#38BDF8" class="particle-1" />
    <circle cx="295" cy="28"  r="1"   fill="#818CF8" class="particle-2" />
    <circle cx="460" cy="52"  r="1.1" fill="#38BDF8" class="particle-3" />
    <circle cx="185" cy="235" r="0.9" fill="#818CF8" class="particle-1" style="animation-delay: 2s;" />
    <circle cx="85"  cy="175" r="1.2" fill="#38BDF8" class="particle-2" style="animation-delay: 1s;" />
    <circle cx="400" cy="248" r="0.9" fill="#A78BFA" class="particle-3" style="animation-delay: 3s;" />
    <circle cx="340" cy="115" r="0.7" fill="#38BDF8" class="particle-1" style="animation-delay: 4s;" />
    <circle cx="145" cy="128" r="1"   fill="#818CF8" class="particle-2" style="animation-delay: 2.5s;" />
    <circle cx="48"  cy="78"  r="0.8" fill="#A78BFA" class="particle-3" style="animation-delay: 1.5s;" />
    <circle cx="430" cy="168" r="0.9" fill="#38BDF8" class="particle-1" style="animation-delay: 3.5s;" />
    <circle cx="510" cy="110" r="0.7" fill="#A78BFA" class="particle-2" style="animation-delay: 5s;" />
    <circle cx="250" cy="200" r="0.8" fill="#38BDF8" class="particle-3" style="animation-delay: 4.5s;" />
  </g>

  <!-- ═══════════ Decorative Code Symbols ═══════════ -->
  <text x="465" y="60" class="code-symbol symbol-float" font-size="26" opacity="0.06">&lt; /&gt;</text>
  <text x="375" y="255" class="code-symbol symbol-float" font-size="20" opacity="0.04" style="animation-delay: 3s;">{ }</text>
  <text x="495" y="235" class="code-symbol symbol-float" font-size="16" opacity="0.04" style="animation-delay: 5s;">[ ]</text>

  <!-- ═══════════ Animated Border ═══════════ -->
  <rect x="2.5" y="2.5" width="845" height="275" rx="14" fill="none"
        stroke="url(#border-grad)" stroke-width="1.5" class="traced-border" />

  <!-- ═══════════ Neural Constellation (Right Side) ═══════════ -->
  <g class="floating" opacity="0.8">
    <!-- Outer Frame Lines -->
    <line x1="585" y1="55"  x2="660" y2="90"  stroke="#1E293B" stroke-width="1" />
    <line x1="660" y1="90"  x2="745" y2="60"  stroke="#1E293B" stroke-width="1" />
    <line x1="745" y1="60"  x2="795" y2="128" stroke="#1E293B" stroke-width="1" />
    <line x1="795" y1="128" x2="755" y2="195" stroke="#1E293B" stroke-width="1" />
    <line x1="755" y1="195" x2="675" y2="222" stroke="#1E293B" stroke-width="1" />
    <line x1="675" y1="222" x2="595" y2="188" stroke="#1E293B" stroke-width="1" />
    <line x1="595" y1="188" x2="585" y2="55"  stroke="#1E293B" stroke-width="1" />

    <!-- Inner Web — spokes to center hub -->
    <line x1="585" y1="55"  x2="695" y2="145" stroke="#38BDF8" stroke-width="0.6" opacity="0.25" />
    <line x1="660" y1="90"  x2="695" y2="145" stroke="#0E75B6" stroke-width="0.7" opacity="0.4" />
    <line x1="745" y1="60"  x2="695" y2="145" stroke="#38BDF8" stroke-width="0.6" opacity="0.3" />
    <line x1="795" y1="128" x2="695" y2="145" stroke="#818CF8" stroke-width="0.6" opacity="0.35" />
    <line x1="755" y1="195" x2="695" y2="145" stroke="#38BDF8" stroke-width="0.6" opacity="0.3" />
    <line x1="675" y1="222" x2="695" y2="145" stroke="#0E75B6" stroke-width="0.7" opacity="0.4" />
    <line x1="595" y1="188" x2="695" y2="145" stroke="#818CF8" stroke-width="0.6" opacity="0.3" />

    <!-- Diagonal cross-links -->
    <line x1="660" y1="90"  x2="755" y2="195" stroke="#38BDF8" stroke-width="0.4" opacity="0.15" />
    <line x1="745" y1="60"  x2="675" y2="222" stroke="#818CF8" stroke-width="0.4" opacity="0.12" />
    <line x1="585" y1="55"  x2="795" y2="128" stroke="#A78BFA" stroke-width="0.3" opacity="0.1" />

    <!-- Outer Nodes -->
    <circle cx="585" cy="55"  r="3.5" fill="#38BDF8" opacity="0.85" />
    <circle cx="660" cy="90"  r="4.5" fill="#0E75B6" opacity="0.9" />
    <circle cx="745" cy="60"  r="3.5" fill="#818CF8" opacity="0.75" />
    <circle cx="795" cy="128" r="4"   fill="#38BDF8" opacity="0.8" />
    <circle cx="755" cy="195" r="4.5" fill="#0E75B6" opacity="0.85" />
    <circle cx="675" cy="222" r="3.5" fill="#818CF8" opacity="0.75" />
    <circle cx="595" cy="188" r="4"   fill="#38BDF8" opacity="0.8" />

    <!-- Central Hub — pulsing -->
    <circle cx="695" cy="145" r="5" fill="#38BDF8" class="pulse-node"
            filter="url(#soft-glow)" />

    <!-- Secondary Hub -->
    <circle cx="720" cy="182" r="4" fill="#10B981" class="pulse-node"
            filter="url(#soft-glow)" style="animation-delay: 1.8s;" />

    <!-- Tertiary Hub -->
    <circle cx="625" cy="120" r="3.5" fill="#A78BFA" class="pulse-node"
            filter="url(#soft-glow)" style="animation-delay: 0.9s;" />
  </g>

  <!-- ═══════════ Profile Content (Left Side) ═══════════ -->
  <g transform="translate(48, 0)">

    <!-- Position & Company (top context) -->
    <text x="2" y="60" class="context-upper">
      <tspan>Jr. Software Engineer</tspan>
      <tspan fill="#38BDF8" class="dot-sep" dx="6">·</tspan>
      <tspan dx="6">Codesy Consulting</tspan>
    </text>

    <!-- Name — the hero -->
    <text x="0" y="122" class="title-name">Hamza Kamelen</text>

    <!-- Accent line -->
    <line x1="0" y1="140" x2="240" y2="140" stroke="url(#accent-grad)" stroke-width="2"
          class="accent-line" />

    <!-- Role statement -->
    <g transform="translate(0, 182)">
      <text x="0" y="0" class="role-title" opacity="0.45">&gt; </text>
      <text x="22" y="0" class="role-title">i build with code &amp; AI<tspan class="cursor">|</tspan></text>
    </g>

    <!-- Education (bottom context) -->
    <text x="2" y="228" class="context-lower">
      <tspan>BS-AI Graduate</tspan>
      <tspan fill="#38BDF8" class="dot-sep" dx="5">·</tspan>
      <tspan dx="5">Dawood University of Engg. &amp; Tech '26</tspan>
    </text>

  </g>

  <!-- ═══════════ Status Indicator (Bottom Right) ═══════════ -->
  <g transform="translate(698, 258)">
    <circle cx="0" cy="-3" r="3" fill="#10B981" class="status-dot"
            filter="drop-shadow(0 0 4px #10B981)" />
    <text x="10" y="0" class="status-text">open to collabs</text>
  </g>

</svg>
